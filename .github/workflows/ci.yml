name: CI

on:
  pull_request:
  push:
    branches: [main]

# Hủy lần chạy cũ khi push commit mới lên cùng branch/PR.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22 # Backend yêu cầu Node >= 22.13 (node:sqlite)
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Format check
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Backend tests
        run: npm test

      - name: Backend check
        run: npm --prefix Backend run check

      - name: Build frontend
        run: npm run build

      # Cần build trước; tự chạy backend (4000) + frontend (3100) với DB in-memory.
      - name: Integration tests
        run: npm run test:integration
